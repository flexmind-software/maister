<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maister Tasks</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e2e5ea;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--text:#e6e9ee;--muted:#9aa4b2;--border:#2e3640;--accent:#818cf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 10px}.toolbar input{min-width:260px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 11px;color:var(--muted)}.pill b{color:var(--text)}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:960px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}tr:last-child td{border-bottom:0}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.type{font-size:11px;text-transform:uppercase;color:var(--accent);font-weight:700}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}.in_progress{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}.completed{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.failed,.blocked{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}.pending{color:var(--muted);background:var(--bg)}.next{color:var(--muted);max-width:330px}.empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body><main class="wrap">
<h1>Maister tasks</h1><div id="sub" class="sub"></div>
<div id="summary" class="summary"></div>
<div class="toolbar"><input id="search" placeholder="Search tasks…"><select id="type"><option value="">All types</option></select><select id="status"><option value="">All statuses</option></select></div>
<div class="card"><table><thead><tr><th>Type</th><th>Name</th><th>Description</th><th>Status</th><th>Next action</th><th>Commit</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script src="dashboard-data.js"></script><script>
const data=window.MAISTER_TASK_INDEX||{tasks:[]},tasks=data.tasks||[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types=[...new Set(tasks.map(t=>t.type))].sort(),statuses=[...new Set(tasks.map(t=>t.status))].sort();for(const [id,values] of [['type',types],['status',statuses]])for(const v of values)document.getElementById(id).insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`);
function render(){const q=document.getElementById('search').value.toLowerCase(),type=document.getElementById('type').value,status=document.getElementById('status').value;const shown=tasks.filter(t=>(!q||JSON.stringify(t).toLowerCase().includes(q))&&(!type||t.type===type)&&(!status||t.status===status));document.getElementById('rows').innerHTML=shown.length?shown.map(t=>{const commit=t.commit_status==='committed'?`${esc(t.commit_sha||'committed')}<br><span class="sub">${esc(t.commit_message||'')}</span>`:`<span class="sub">${esc(t.commit_status||'not recorded')}</span>`;return `<tr><td><span class="type">${esc(t.type)}</span></td><td><a href="${esc(t.dashboard)}"><strong>${esc(t.name)}</strong></a><br><a class="sub" href="${esc(t.state)}">state</a></td><td>${esc(t.description)}</td><td><span class="badge ${esc(t.status)}">${esc(t.status)}</span></td><td class="next">${esc(t.next_action)}</td><td>${commit}</td><td>${esc(t.updated||'—')}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No tasks match the filter.</td></tr>';document.getElementById('summary').innerHTML=statuses.map(s=>`<span class="pill">${esc(s)} <b>${tasks.filter(t=>t.status===s).length}</b></span>`).join('');document.getElementById('sub').textContent=`${tasks.length} tasks · generated ${data.generated||'—'}`}
for(const id of ['search','type','status'])document.getElementById(id).addEventListener('input',render);render();
</script></body></html>
